# Hyperparameter search space -- 1D-CNN
# Method: Optuna (TPE); Budget: 30 trials; Selection target: val macro-F1
# Frozen: 2026-05-26 (Task 2.2)
conv_blocks:        {type: int,         low: 2, high: 4}
filters_per_block:  {type: categorical, choices: [32, 64, 128]}
kernel_size:        {type: categorical, choices: [3, 5, 7]}
dropout:            {type: float,       low: 0.0, high: 0.5}
dense_units:        {type: categorical, choices: [64, 128, 256]}
optimizer:          {type: categorical, choices: [adam, adamw]}
learning_rate:      {type: float,       low: 1.0e-4, high: 1.0e-2, log: true}
batch_size:         {type: categorical, choices: [128, 256, 512]}
max_epochs: 100
early_stopping_patience: 10
